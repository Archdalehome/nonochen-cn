name: Deploy to Cloudflare

# Publishes the Worker on every push to main, so the live site follows the repo.
# Can also be started by hand from the Actions tab ("Run workflow"), which is the
# quickest way to redeploy without a commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time: a half-uploaded Worker is worse than a queued one, so a
# running deploy is never cancelled - the next push just waits its turn.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # CLOUDFLARE_API_TOKEN must be a repository secret (see README -> Continuous
  # deployment). The account id is not a credential - it appears in dashboard
  # URLs - so it falls back to the account this repo is bound to.
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '7357c2534797a4c04fc95ec58cc04a89' }}
  # The smoke test signs into /admin. The Worker defaults to admin/admin; if you
  # replace the password with a secret, add the same values as SMOKE_ADMIN_USER /
  # SMOKE_ADMIN_PASSWORD repository secrets and the smoke test follows.
  SMOKE_ADMIN_USER: ${{ secrets.SMOKE_ADMIN_USER || 'admin' }}
  SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD || 'admin' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The images/ diff below needs the previous commit, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Is CLOUDFLARE_API_TOKEN configured?
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::error title=Missing CLOUDFLARE_API_TOKEN::Add the secret in Settings -> Secrets and variables -> Actions (see README -> Continuous deployment), then re-run this job."
          exit 1

      - name: 校验 API Token 是否有效
        run: |
          set -uo pipefail
          echo "token 长度: ${#CLOUDFLARE_API_TOKEN} | account id 长度: ${#CLOUDFLARE_ACCOUNT_ID}"
          code=$(curl -s -o /tmp/cf.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.cloudflare.com/client/v4/accounts)
          echo "GET /accounts -> HTTP $code"
          head -c 400 /tmp/cf.json; echo
          if [ "$code" != "200" ]; then
            echo "::error title=API Token 被 Cloudflare 拒绝::上面是 Cloudflare 的原话，9109 = 令牌值无效"
            exit 1
          fi
          if ! grep -q "$CLOUDFLARE_ACCOUNT_ID" /tmp/cf.json; then
            echo "::warning::token 有效，但账号列表里没有 CLOUDFLARE_ACCOUNT_ID"
          fi
          echo "token 有效"

      - name: Check the views render
        run: npm run check

      # 中文站（内销）与英文站分库：库名写死为 el_store_cn，database_id 在
      # wrangler.jsonc 里只是占位，每次部署前按库名解析真实 ID 再写回配置。
      # 这样换账号、换库都不必手改仓库。找不到就创建一个。
      - name: 解析或创建中文站独立的 D1 库
        id: d1db
        run: |
          set -euo pipefail
          DB_NAME=$(node -e "import('./scripts/wrangler-cli.mjs').then((m) => console.log(m.bindings().database))")
          echo "目标库: $DB_NAME"
          if npx wrangler d1 list --json > /tmp/d1.json 2>/tmp/d1.err; then
            echo "d1 list 成功"
          else
            echo "::warning::wrangler d1 list 失败（可能是 token 缺 D1 读权限），原始输出："
            cat /tmp/d1.err || true
            echo '[]' > /tmp/d1.json
          fi
          ID=$(node -e "
            const fs = require('fs');
            let list = [];
            try { list = JSON.parse(fs.readFileSync('/tmp/d1.json', 'utf8')); } catch {}
            if (!Array.isArray(list)) list = [];
            const hit = list.find((d) => d && d.name === process.argv[1]);
            console.log(hit ? (hit.uuid || hit.id) : '');
          " "$DB_NAME")
          if [ -z "$ID" ]; then
            echo "库里没有 $DB_NAME，创建中…"
            npx wrangler d1 create "$DB_NAME" --location apac > /tmp/create.log 2>&1 || true
            echo "--- wrangler d1 create 原始输出 ---"
            cat /tmp/create.log || true
            ID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/create.log | head -n1 || true)
          fi
          if [ -z "$ID" ]; then
            echo "--- d1 list 原始输出（前 400 字）---"
            head -c 400 /tmp/d1.json || true
            echo
            echo "::error title=D1 库不可用::无法创建或找到 $DB_NAME，原因见上面的 wrangler 原始输出。"
            exit 1
          fi
          echo "D1 $DB_NAME -> $ID"
          sed -i "s/\"database_id\": *\"[^\"]*\"/\"database_id\": \"$ID\"/" wrangler.jsonc
          grep -n 'database_name\|database_id' wrangler.jsonc
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Mirror ./images into the assets directory
        run: node scripts/setup.mjs --skip-db

      # Applying migrations needs Account - D1: Edit on the token. Probing first
      # keeps a code-only push deployable with a Workers + R2 token: the deploy
      # below still runs, it just warns that the schema was left alone.
      - name: Can this token reach D1?
        id: d1
        run: |
          set -euo pipefail
          database=$(node -e "import('./scripts/wrangler-cli.mjs').then((m) => console.log(m.bindings().database))")
          if npx wrangler d1 migrations list "$database" --remote > /dev/null 2>&1; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "the token can read D1 - new migrations will be applied"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "the token cannot read D1 - migrations will be skipped"
          fi

      - name: Apply new D1 migrations
        if: steps.d1.outputs.reachable == 'true'
        run: node scripts/setup.mjs --remote --db-only --skip-copy

      - name: D1 migrations skipped
        if: steps.d1.outputs.reachable != 'true'
        run: |
          echo "::warning title=D1 migrations were skipped::CLOUDFLARE_API_TOKEN cannot reach D1, so any new migrations/*.sql were not applied. Add 'Account - D1: Edit' to the token and re-run, or apply them from a machine where 'npx wrangler login' works: npm run db:remote"

      - name: Deploy the Worker
        id: deploy
        run: |
          set -euo pipefail
          npm run deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' deploy.log | head -n1 || true)
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "deployed to ${url:-<no url in wrangler output>}"

      - name: Smoke test the deployment
        if: steps.deploy.outputs.url != ''
        # `wrangler deploy` returns before every edge serves the new release, so
        # the header-placement check retries (up to ~60s) instead of failing on
        # the markup the previous release left behind.
        env:
          SMOKE_HEADER_ATTEMPTS: '12'
        run: node scripts/smoke.mjs "${{ steps.deploy.outputs.url }}"

      - name: Did the push touch images/?
        id: media
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "manual run - syncing every object"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            # New branch or a force push: nothing sensible to diff against.
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "no previous commit to diff - syncing every object"
          elif git diff --quiet "$before" "${{ github.sha }}" -- images/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "./images is unchanged - skipping the R2 sync"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --name-only "$before" "${{ github.sha }}" -- images/
          fi

      - name: Sync ./images to the R2 bucket
        if: steps.media.outputs.changed == 'true'
        run: npm run media:remote -- --concurrency 4

      - name: Keep the Wrangler log when a deploy fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log
          path: deploy.log
          if-no-files-found: ignore
          retention-days: 7
